name: Regression checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'strix/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm run install:ci
      - run: npm run lint
      - run: npm run build
      - run: npx --no-install tsc --noEmit
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - name: Prepare the explicit local Docker backend
        run: |
          test -x /usr/bin/flock
          test -d /proc/self/fd
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock version --format '{{.Server.Version}}'
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock pull \
            node@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
      - run: npm run test:connectors
      - run: npm run test:workspace-loop
      - run: npm run test:unit
      - run: npm run test:local
      - run: npm run test:execution:domain
      - name: Keep shared test artifacts owned by the ordinary CI user
        run: |
          mkdir -p test-results
          test -O test-results
          test -w test-results
      - name: Run real Docker execution checks with trusted host proc access
        run: |
          runner_node="$(command -v node)"
          sudo -- env -i PATH=/usr/local/bin:/usr/bin:/bin "$runner_node" \
            scripts/test-execution.mjs
      - name: Verify native local accounts, supervisor, real Docker and execution UI
        run: |
          runner_node="$(command -v node)"
          sudo -- env -i PATH=/usr/local/bin:/usr/bin:/bin \
            PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" "$runner_node" \
            --experimental-strip-types tests/execution/backend-native.mjs
      - run: npm run test:browser-policy
      - run: npm run test:auth
      - name: Verify local authentication in the already-built native server
        run: node --experimental-strip-types tests/auth/native-api.mjs
      - name: Verify readonly Ticket, Plan, manual and execution Run MCP queries
        run: npm run test:mcp:task-reads
      - run: npm run test:planning:revisions
      - run: npm run test:execution:configuration
      - run: npm run test:planning:recovery
      - run: npm run test:planning:lifecycle
      - run: npm run test:planning:review
      - run: npm run test:execution:api
      - run: npm run test:authorization:browser
      - run: npm run test:planning:browser
      - run: npm run test:auth:browser
      - run: npm run test:integration
      - name: Upload failure logs and synthetic browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/**/*.log
            test-results/**/*-evidence.json
            test-results/**/fixtures.json
            test-results/**/*.png
