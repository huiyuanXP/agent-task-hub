name: Regression checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'strix/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm run install:ci
      - run: npm run lint
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - name: Prepare the explicit local Docker backend
        run: |
          test -x /usr/bin/flock
          test -d /proc/self/fd
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock version --format '{{.Server.Version}}'
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock pull \
            node@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
      - run: npm run test:unit
      - name: Run real Docker execution checks with trusted host proc access
        run: |
          runner_node="$(command -v node)"
          sudo -- env -i PATH=/usr/local/bin:/usr/bin:/bin "$runner_node" \
            --experimental-strip-types --test --test-concurrency=1 tests/execution/*.test.mjs
      - name: Verify real Worker, Access identity, supervisor, Docker and execution UI
        run: |
          runner_node="$(command -v node)"
          sudo -- env -i PATH=/usr/local/bin:/usr/bin:/bin \
            PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" "$runner_node" \
            --experimental-strip-types tests/execution/backend-worker.mjs
      - run: npm run test:browser-policy
      - run: npm run test:auth
      - name: Verify identity in the already-built Worker
        run: node --experimental-strip-types tests/auth/worker-api.mjs
      - run: npm run test:planning:revisions
      - run: npm run test:auth:browser
      - run: npm run test:integration
      - name: Upload failure logs and synthetic browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/**/*.log
            test-results/**/*-evidence.json
            test-results/**/fixtures.json
            test-results/**/*.png
